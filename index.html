<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscripción Instituto Livier</title>

<style>
body {
    font-family: system-ui;
    margin:0;
    background: linear-gradient(135deg,#1a5c58,#25d366);
}
.container {
    max-width:500px;
    margin:auto;
    background:#fff;
    border-radius:20px;
    padding:20px;
    margin-top:20px;
}
.step { display:none; }
.step.active { display:block; }

input, select {
    width:100%;
    padding:14px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #ddd;
}

button {
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:#25d366;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.progress {
    height:6px;
    background:#eee;
    margin-bottom:15px;
    border-radius:10px;
}
.bar {
    height:100%;
    width:33%;
    background:#25d366;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="progress"><div class="bar" id="bar"></div></div>

<h2>Inscripción</h2>

<!-- PASO 1 -->
<div class="step active">
<select id="curso" onchange="actualizarHorarios()">
<option disabled selected>Selecciona curso</option>

<option>Bachillerato Garantizado</option>
<option>Bachillerato Livier</option>
<option>Primaria</option>
<option>Secundaria</option>
<option>Asistente Educativo</option>
<option>Inglés Kids y Teens</option>
<option>Lectoescritura Kids y Teens</option>
<option>Computación 6 meses</option>
<option>Computación + Inglés</option>
<option>Colorimetría</option>
<option>Tratamientos Capilares</option>
<option>Maquillaje Profesional</option>
<option>Cortes y Barbería</option>
<option>Uñas Artísticas</option>
<option>Lashista</option>
<option>Terapeuta Spa</option>
</select>

<select id="horario"></select>

<button onclick="next()">Continuar</button>
</div>

<!-- PASO 2 -->
<div class="step">
<input id="nombre" placeholder="Nombre completo">
<input id="nacionalidad" placeholder="Nacionalidad">
<input id="fecha" placeholder="Fecha nacimiento DD/MM/AAAA">
<input id="edad" placeholder="Edad">
<input id="telefono" placeholder="Teléfono">
<input id="correo" placeholder="Correo">
<input id="domicilio" placeholder="Domicilio">
<input id="estudios" placeholder="Último grado de estudios">

<button onclick="prev()">Atrás</button>
<button onclick="next()">Continuar</button>
</div>

<!-- PASO 3 -->
<div class="step">
<input id="tutor" placeholder="Nombre tutor">
<input id="tel_tutor" placeholder="Tel tutor">
<input id="parentesco" placeholder="Parentesco">
<input id="ocupacion" placeholder="Ocupación">

<button onclick="prev()">Atrás</button>
<button onclick="guardar(event)">Enviar</button>
</div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbwP7JCcv2kYOVUou2thdzmdXNBOtMGbp03av722obtKzv3K7D5zttxhuJmxqAW0Sh5t_g/exec";

// HORARIOS
const horariosBeauty = [
"📍 Lakin - Lunes 8am-2pm",
"📍 Lakin - Martes 8am-2pm",
"📍 Lakin - Miércoles 8am-2pm",
"📍 Lakin - Jueves 2pm-8pm",
"📍 Lakin - Viernes 2pm-8pm",
"📍 Lakin - Sábado 8am-2pm",
"📍 Lakin - Sábado 2pm-8pm"
];

const opciones = {
"Primaria":[
"📍 Kabah - Mar/Mié 6pm-8pm",
"📍 Lakin - Mar/Mié 6pm-8pm"
],
"Secundaria":[
"📍 Kabah - Mar/Mié 6pm-8pm",
"📍 Lakin - Mar/Mié 6pm-8pm"
],
"Bachillerato Garantizado":[
"📍 Tulum - Sáb 4pm-9pm",
"📍 Lakin - Sáb 4pm-9pm",
"💻 Online - Sáb 4pm-9pm",
"📍 Kabah - Dom 8am-1pm"
],
"Bachillerato Livier":[
"📍 Kabah - Lun 7:30am-10am",
"📍 Lakin - Lun 3pm-5:30pm"
],
"Asistente Educativo":[
"📍 Kabah - Lun/Jue 5:30pm-8:30pm",
"📍 Kabah - Sáb 7am-1pm"
],
"Inglés Kids y Teens":[
"📍 Kabah - Sáb 1pm-4pm",
"📍 Lakin - Sáb 1pm-4pm"
],
"Lectoescritura Kids y Teens":[
"📍 Tulum - Sáb 12pm-4pm"
],
"Computación 6 meses":[
"📍 Lakin - Sáb 8am-12pm"
],
"Computación + Inglés":[
"📍 Lakin - Sáb 4pm-8pm"
],
"Colorimetría": horariosBeauty,
"Tratamientos Capilares": horariosBeauty,
"Maquillaje Profesional": horariosBeauty,
"Cortes y Barbería": horariosBeauty,
"Uñas Artísticas": horariosBeauty,
"Lashista": horariosBeauty,
"Terapeuta Spa": horariosBeauty
};

// actualizar horarios
function actualizarHorarios(){
let c=document.getElementById("curso").value;
let h=document.getElementById("horario");
h.innerHTML="";
(opciones[c]||[]).forEach(x=>{
let o=document.createElement("option");
o.textContent=x;
h.appendChild(o);
});
}

// pasos
let step=0;
const steps=document.querySelectorAll(".step");

function show(){
steps.forEach(s=>s.classList.remove("active"));
steps[step].classList.add("active");
document.getElementById("bar").style.width=((step+1)*33)+"%";
}

function next(){ if(step<2) step++; show(); }
function prev(){ if(step>0) step--; show(); }

// formato fecha
document.getElementById('fecha').addEventListener('input', e=>{
let v=e.target.value.replace(/\D/g,'').slice(0,8);
if(v.length>=5) e.target.value=v.replace(/(\d{2})(\d{2})(\d{1,4})/,'$1/$2/$3');
else if(v.length>=3) e.target.value=v.replace(/(\d{2})(\d{1,2})/,'$1/$2');
});

// GUARDAR
async function guardar(event){

const btn = event.target;
btn.disabled = true;
btn.innerText = "Enviando...";

let data = {
nombre: document.getElementById("nombre").value,
nacionalidad: document.getElementById("nacionalidad").value,
fecha: document.getElementById("fecha").value,
edad: document.getElementById("edad").value,
telefono: document.getElementById("telefono").value,
correo: document.getElementById("correo").value,
domicilio: document.getElementById("domicilio").value,
estudios: document.getElementById("estudios").value,
curso: document.getElementById("curso").value,
horario: document.getElementById("horario").value,
tutor: document.getElementById("tutor").value,
tel_tutor: document.getElementById("tel_tutor").value,
parentesco: document.getElementById("parentesco").value,
ocupacion: document.getElementById("ocupacion").value
};

if(!data.nombre || !data.telefono || !data.curso || !data.horario){
alert("Completa los datos");
btn.disabled = false;
btn.innerText = "Enviar";
return;
}

try {

await fetch(API,{
method:"POST",
body:JSON.stringify(data),
headers:{"Content-Type":"application/json"}
});

// WHATSAPP ADMIN FORMATO EXACTO
let adminMsg = `*1. PROGRAMA*
*Curso:* ${data.curso}
*Horario:* ${data.horario}

*2. DATOS DEL ALUMNO*
*Nombre:* ${data.nombre}
*Nacionalidad:* ${data.nacionalidad}
*Fecha Nac:* ${data.fecha}
*Edad:* ${data.edad}
*Teléfono:* ${data.telefono}
*Correo:* ${data.correo}
*Domicilio:* ${data.domicilio}
*Estudios:* ${data.estudios}

*3. TUTOR / EMERGENCIA*
*Nombre:* ${data.tutor}
*Teléfono:* ${data.tel_tutor}
*Parentesco:* ${data.parentesco}
*Ocupación:* ${data.ocupacion}`;

// MENSAJE CLIENTE
let clienteMsg = `Hola ${data.nombre} 👋

Tu inscripción fue registrada correctamente ✅

📌 Para confirmar tu lugar realiza tu pago:

💳 Santander
Cuenta: 65-50895178-1
CLABE: 014691655089517814

💳 Tarjeta:
5579 0890 0527 7178

🏫 También puedes pagar en nuestros planteles

📲 Envía tu comprobante por este medio`;

// abrir whatsapp
window.open(`https://wa.me/529987593954?text=${encodeURIComponent(adminMsg)}`);

setTimeout(()=>{
window.open(`https://wa.me/52${data.telefono}?text=${encodeURIComponent(clienteMsg)}`);
},1200);

alert("Inscripción enviada ✅");

} catch(e){
alert("Error ❌");
console.error(e);
}

btn.disabled = false;
btn.innerText = "Enviar";
}
</script>

</body>
</html>

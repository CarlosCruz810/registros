<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscripción Instituto Livier</title>

<style>
body {
    font-family: system-ui;
    margin:0;
    background: linear-gradient(135deg,#1a5c58,#25d366);
}
.container {
    max-width:500px;
    margin:auto;
    background:#fff;
    border-radius:20px;
    padding:20px;
    margin-top:20px;
}
h2 { text-align:center; }

.step { display:none; }
.step.active { display:block; }

input, select {
    width:100%;
    padding:14px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #ddd;
}

button {
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:#25d366;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.progress {
    height:6px;
    background:#eee;
    margin-bottom:15px;
    border-radius:10px;
}

.bar {
    height:100%;
    width:33%;
    background:#25d366;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="progress"><div class="bar" id="bar"></div></div>

<h2>Inscripción</h2>

<!-- PASO 1 -->
<div class="step active">

<select id="curso" onchange="actualizarHorarios()">
<option disabled selected>Selecciona curso</option>

<option>Bachillerato Garantizado</option>
<option>Bachillerato Livier</option>

<option>Primaria</option>
<option>Secundaria</option>

<option>Asistente Educativo</option>

<option>Inglés Kids y Teens</option>
<option>Lectoescritura Kids y Teens</option>

<option>Computación 6 meses</option>
<option>Computación + Inglés</option>

<option>Colorimetría</option>
<option>Tratamientos Capilares</option>
<option>Maquillaje Profesional</option>
<option>Cortes y Barbería</option>
<option>Uñas Artísticas</option>
<option>Lashista</option>
<option>Terapeuta Spa</option>
</select>

<select id="horario">
<option disabled selected>Selecciona horario</option>
</select>

<button onclick="next()">Continuar</button>
</div>

<!-- PASO 2 -->
<div class="step">
<input id="nombre" placeholder="Nombre(s)">
<input id="apellidos" placeholder="Apellidos">
<input id="fecha" placeholder="DD/MM/AA">
<input id="telefono" placeholder="Teléfono">
<input id="correo" placeholder="Correo">

<button onclick="prev()">Atrás</button>
<button onclick="next()">Continuar</button>
</div>

<!-- PASO 3 -->
<div class="step">
<input id="tutor" placeholder="Nombre tutor">
<input id="tel_tutor" placeholder="Tel tutor">
<input id="parentesco" placeholder="Parentesco">

<button onclick="prev()">Atrás</button>
<button onclick="guardar()">Guardar y Enviar</button>
</div>

</div>

<script>

// HORARIOS BEAUTY
const horariosBeauty = [
"📍 Lakin - Lunes 8am-2pm",
"📍 Lakin - Martes 8am-2pm",
"📍 Lakin - Miércoles 8am-2pm",
"📍 Lakin - Jueves 2pm-8pm",
"📍 Lakin - Viernes 2pm-8pm",
"📍 Lakin - Sábado 8am-2pm",
"📍 Lakin - Sábado 2pm-8pm"
];

// HORARIOS
const opciones = {

"Primaria":[
"📍 Kabah - Mar/Mié 6pm-8pm",
"📍 Lakin - Mar/Mié 6pm-8pm",
"📍 Kabah - Dom 9am-1pm",
"📍 Lakin - Dom 9am-1pm"
],

"Secundaria":[
"📍 Kabah - Mar/Mié 6pm-8pm",
"📍 Lakin - Mar/Mié 6pm-8pm",
"📍 Kabah - Dom 9am-1pm",
"📍 Lakin - Dom 9am-1pm"
],

"Bachillerato Garantizado":[
"📍 Tulum - Sáb 4pm-9pm",
"📍 Lakin - Sáb 4pm-9pm",
"💻 Online - Sáb 4pm-9pm",
"📍 Kabah - Dom 8am-1pm"
],

"Bachillerato Livier":[
"📍 Kabah - Lun 7:30am-10am",
"📍 Lakin - Lun 3pm-5:30pm"
],

"Asistente Educativo":[
"📍 Kabah - Lun/Jue 5:30pm-8:30pm",
"📍 Kabah - Sáb 7am-1pm"
],

"Inglés Kids y Teens":[
"📍 Kabah - Sáb 1pm-4pm",
"📍 Lakin - Sáb 1pm-4pm"
],

"Lectoescritura Kids y Teens":[
"📍 Tulum - Sáb 12pm-4pm"
],

"Computación 6 meses":[
"📍 Lakin - Sáb 8am-12pm"
],

"Computación + Inglés":[
"📍 Lakin - Sáb 4pm-8pm"
],

"Colorimetría": horariosBeauty,
"Tratamientos Capilares": horariosBeauty,
"Maquillaje Profesional": horariosBeauty,
"Cortes y Barbería": horariosBeauty,
"Uñas Artísticas": horariosBeauty,
"Lashista": horariosBeauty,
"Terapeuta Spa": horariosBeauty
};

// actualizar horarios
function actualizarHorarios(){
let c=document.getElementById("curso").value;
let h=document.getElementById("horario");

h.innerHTML='<option disabled selected>Selecciona horario</option>';

opciones[c]?.forEach(x=>{
let o=document.createElement("option");
o.textContent=x;
h.appendChild(o);
});
}

// steps
let step=0;
const steps=document.querySelectorAll(".step");

function show(){
steps.forEach(s=>s.classList.remove("active"));
steps[step].classList.add("active");
document.getElementById("bar").style.width=((step+1)*33)+"%";
}

function next(){ if(step<2) step++; show(); }
function prev(){ if(step>0) step--; show(); }

// fecha formato
document.getElementById('fecha').addEventListener('input', e=>{
let v=e.target.value.replace(/\D/g,'').slice(0,6);
if(v.length>=5) e.target.value=v.replace(/(\d{2})(\d{2})(\d{1,2})/,'$1/$2/$3');
else if(v.length>=3) e.target.value=v.replace(/(\d{2})(\d{1,2})/,'$1/$2');
});

// guardar
async function guardar(){

let data = {
    nombre: document.getElementById("nombre").value + " " + document.getElementById("apellidos").value,
    telefono: document.getElementById("telefono").value,
    correo: document.getElementById("correo").value,
    curso: document.getElementById("curso").value,
    horario: document.getElementById("horario").value
};

if(!data.nombre || !data.curso || !data.horario){
    alert("Completa los datos");
    return;
}

try {

    await fetch("https://script.google.com/macros/s/AKfycbwP7JCcv2kYOVUou2thdzmdXNBOtMGbp03av722obtKzv3K7D5zttxhuJmxqAW0Sh5t_g/exec", {
        method: "POST",
        body: JSON.stringify(data),
        mode: "no-cors"
    });

    let msg = `Nueva inscripción%0A${data.nombre}%0ACurso: ${data.curso}%0AHorario: ${data.horario}`;
    window.open(`https://wa.me/529987593954?text=${msg}`);

    alert("Inscripción enviada ✅");

} catch(error){
    alert("Error ❌");
    console.error(error);
}
}
</script>

</body>
</html>

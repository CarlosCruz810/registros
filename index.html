<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscripción Instituto Livier</title>

<style>
body {
    font-family: system-ui;
    margin:0;
    background: linear-gradient(135deg,#1a5c58,#25d366);
}

.container {
    max-width:500px;
    margin:auto;
    background:#fff;
    border-radius:20px;
    padding:20px;
    margin-top:20px;
}

h2 { text-align:center; }

.step { display:none; }
.step.active { display:block; }

input, select {
    width:100%;
    padding:14px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #ddd;
}

button {
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:#25d366;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.progress {
    height:6px;
    background:#eee;
    margin-bottom:15px;
    border-radius:10px;
}

.bar {
    height:100%;
    width:33%;
    background:#25d366;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="progress"><div class="bar" id="bar"></div></div>

<h2>Inscripción</h2>

<!-- PASO 1 -->
<div class="step active">
<select id="curso" onchange="actualizarHorarios()">
<option disabled selected>Selecciona curso</option>
<option>Bachillerato Garantizado</option>
<option>Bachillerato Livier</option>
<option>Primaria y Secundaria</option>
<option>Asistente Educativo</option>
<option>Inglés Kids y Teens</option>
<option>Lectoescritura</option>
<option>Computación</option>
<option>Computación + Inglés</option>
<option>Colorimetría</option>
<option>Cortes y Barbería</option>
<option>Uñas Artísticas</option>
<option>Lashista</option>
<option>Terapeuta Spa</option>
</select>

<select id="horario">
<option disabled selected>Selecciona horario</option>
</select>

<button onclick="next()">Continuar</button>
</div>

<!-- PASO 2 -->
<div class="step">
<input id="nombre" placeholder="Nombre(s)" autocomplete="given-name">
<input id="apellidos" placeholder="Apellidos" autocomplete="family-name">

<input id="fecha" placeholder="DD/MM/AA">
<input id="telefono" placeholder="Teléfono" autocomplete="tel">
<input id="correo" placeholder="Correo" autocomplete="email">

<button onclick="prev()">Atrás</button>
<button onclick="next()">Continuar</button>
</div>

<!-- PASO 3 -->
<div class="step">
<input id="tutor" placeholder="Nombre tutor">
<input id="tel_tutor" placeholder="Tel tutor">
<input id="parentesco" placeholder="Parentesco">

<button onclick="prev()">Atrás</button>
<button onclick="guardar()">Guardar y Enviar</button>
</div>

</div>

<script>

// HORARIOS
const horariosBeauty = [
"Lunes (Lakin) 8am-2pm",
"Martes (Lakin) 8am-2pm",
"Miércoles (Lakin) 8am-2pm",
"Jueves (Lakin) 2pm-8pm",
"Viernes (Lakin) 2pm-8pm",
"Sábado (Lakin) 8am-2pm",
"Sábado (Lakin) 2pm-8pm"
];

const opciones = {
"Bachillerato Garantizado":[
"Sáb 16 Mayo (Tulum) 4pm-9pm",
"Sáb 16 Mayo (Lakin) 4pm-9pm",
"Sáb 16 Mayo (Online) 4pm-9pm",
"Dom 17 Mayo (Kabah) 8am-1pm"
],
"Bachillerato Livier":[
"Lun 18 Mayo (Kabah) 7:30am-10am",
"Lun 18 Mayo (Lakin) 3pm-5:30pm"
],
"Primaria y Secundaria":[
"Mar/Mié 26 Mayo (Kabah/Lakin) 6pm-8pm",
"Dom 7 Junio (Kabah) 9am-1pm"
],
"Asistente Educativo":[
"Lun/Jue (Kabah) 5:30pm-8:30pm",
"Sáb (Kabah) 7am-1pm"
],
"Inglés Kids y Teens":[
"Sáb 30 Mayo (Kabah/Lakin) 1pm-4pm"
],
"Lectoescritura":[
"Sáb 30 Mayo (Tulum) 12pm-4pm"
],
"Computación":[
"Ingreso disponible (consultar asesor)"
],
"Computación + Inglés":[
"Sáb (Lakin) 4pm-8pm"
],

"Colorimetría":horariosBeauty,
"Cortes y Barbería":horariosBeauty,
"Uñas Artísticas":horariosBeauty,
"Lashista":horariosBeauty,
"Terapeuta Spa":horariosBeauty
};

// ACTUALIZAR HORARIOS
function actualizarHorarios(){
let c=document.getElementById("curso").value;
let h=document.getElementById("horario");

h.innerHTML='<option disabled selected>Selecciona horario</option>';

opciones[c]?.forEach(x=>{
let o=document.createElement("option");
o.textContent="📅 "+x;
h.appendChild(o);
});
}

// STEPS
let step=0;
const steps=document.querySelectorAll(".step");

function show(){
steps.forEach(s=>s.classList.remove("active"));
steps[step].classList.add("active");
document.getElementById("bar").style.width=((step+1)*33)+"%";
}

function next(){ if(step<2) step++; show(); }
function prev(){ if(step>0) step--; show(); }

// FECHA FORMATO
document.getElementById('fecha').addEventListener('input', e=>{
let v=e.target.value.replace(/\D/g,'').slice(0,6);
if(v.length>=5) e.target.value=v.replace(/(\d{2})(\d{2})(\d{1,2})/,'$1/$2/$3');
else if(v.length>=3) e.target.value=v.replace(/(\d{2})(\d{1,2})/,'$1/$2');
});

// GUARDAR + API + WHATSAPP
async function guardar(){

let data = {
    nombre: document.getElementById("nombre").value + " " + document.getElementById("apellidos").value,
    telefono: document.getElementById("telefono").value,
    correo: document.getElementById("correo").value,
    curso: document.getElementById("curso").value,
    horario: document.getElementById("horario").value
};

// VALIDACIÓN
if(!data.nombre || !data.curso || !data.horario){
    alert("Completa los datos");
    return;
}

try {

    await fetch("https://script.google.com/macros/s/AKfycbwP7JCcv2kYOVUou2thdzmdXNBOtMGbp03av722obtKzv3K7D5zttxhuJmxqAW0Sh5t_g/exec", {
        method: "POST",
        body: JSON.stringify(data),
        headers: {
            "Content-Type": "application/json"
        }
    });

    let msg = `Nueva inscripción%0A${data.nombre}%0ACurso: ${data.curso}%0AHorario: ${data.horario}`;
    window.open(`https://wa.me/529987593954?text=${msg}`);

    alert("Inscripción guardada correctamente ✅");

} catch(error){
    alert("Error al guardar ❌");
    console.error(error);
}
}
</script>

</body>
</html>

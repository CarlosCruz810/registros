<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscripción Instituto Livier</title>

<style>
body {
    font-family: system-ui;
    margin:0;
    background: linear-gradient(135deg,#1a5c58,#25d366);
}
.container {
    max-width:500px;
    margin:auto;
    background:#fff;
    border-radius:20px;
    padding:20px;
    margin-top:20px;
}
input, select, button {
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
}
button {
    background:#25d366;
    color:#fff;
    border:none;
}
</style>
</head>

<body>

<div class="container">
<h2>Inscripción</h2>

<select id="curso" onchange="cargarHorarios()">
<option disabled selected>Selecciona curso</option>
<option>Bachillerato Garantizado</option>
<option>Bachillerato Livier</option>
<option>Primaria</option>
<option>Secundaria</option>
<option>Asistente Educativo</option>
<option>Inglés Kids y Teens</option>
<option>Lectoescritura Kids y Teens</option>
<option>Computación 6 meses</option>
<option>Computación + Inglés</option>
<option>Colorimetría</option>
<option>Tratamientos Capilares</option>
<option>Maquillaje Profesional</option>
<option>Cortes y Barbería</option>
<option>Uñas Artísticas</option>
<option>Lashista</option>
<option>Terapeuta Spa</option>
</select>

<select id="horario">
<option disabled selected>Selecciona horario</option>
</select>

<input id="nombre" placeholder="Nombre completo">
<input id="nacionalidad" placeholder="Nacionalidad">
<input id="fecha" placeholder="DD/MM/AAAA">
<input id="edad" placeholder="Edad">
<input id="telefono" placeholder="Teléfono">
<input id="correo" placeholder="Correo">
<input id="domicilio" placeholder="Domicilio">
<input id="estudios" placeholder="Estudios">

<input id="tutor" placeholder="Tutor">
<input id="tel_tutor" placeholder="Tel tutor">
<input id="parentesco" placeholder="Parentesco">
<input id="ocupacion" placeholder="Ocupación">

<button onclick="enviar()">Enviar inscripción</button>

</div>

<script>

const horarios = {
"Primaria":[
"Kabah Mar/Mié 6-8pm",
"Kabah Domingo 9-1pm",
"Lakin Mar/Mié 6-8pm"
],
"Secundaria":[
"Kabah Mar/Mié 6-8pm",
"Kabah Domingo 9-1pm",
"Lakin Mar/Mié 6-8pm"
]
};

function cargarHorarios(){
let curso=document.getElementById("curso").value;
let select=document.getElementById("horario");
select.innerHTML="<option>Selecciona horario</option>";

if(horarios[curso]){
horarios[curso].forEach(h=>{
let op=document.createElement("option");
op.textContent=h;
select.appendChild(op);
});
}else{
let op=document.createElement("option");
op.textContent="Horario disponible según plantel";
select.appendChild(op);
}
}

function enviar(){

let msg=`*1. PROGRAMA*
Curso: ${curso.value}
Horario: ${horario.value}
Inscripción: $800

*2. DATOS*
Nombre: ${nombre.value}
Teléfono: ${telefono.value}
Correo: ${correo.value}

*3. TUTOR*
Nombre: ${tutor.value}
Tel: ${tel_tutor.value}`;

window.open("https://wa.me/529987593954?text="+encodeURIComponent(msg));

}

</script>

</body>
</html>

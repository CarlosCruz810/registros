<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscripción Instituto Livier</title>

<style>
body {
    font-family: system-ui;
    margin:0;
    background: linear-gradient(135deg,#1a5c58,#25d366);
}
.container {
    max-width:500px;
    margin:auto;
    background:#fff;
    border-radius:20px;
    padding:20px;
    margin-top:20px;
}
h2 { text-align:center; }

.step { display:none; }
.step.active { display:block; }

input, select {
    width:100%;
    padding:14px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #ddd;
}

button {
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:#25d366;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h2>Inscripción</h2>

<!-- PASO 1 -->
<div class="step active">

<select id="curso" onchange="actualizarHorarios()">
<option disabled selected>Selecciona curso</option>

<option>Bachillerato Garantizado</option>
<option>Bachillerato Livier</option>
<option>Primaria</option>
<option>Secundaria</option>
<option>Asistente Educativo</option>
<option>Inglés Kids y Teens</option>
<option>Lectoescritura Kids y Teens</option>
<option>Computación 6 meses</option>
<option>Computación + Inglés</option>
<option>Colorimetría</option>
<option>Tratamientos Capilares</option>
<option>Maquillaje Profesional</option>
<option>Cortes y Barbería</option>
<option>Uñas Artísticas</option>
<option>Lashista</option>
<option>Terapeuta Spa</option>
</select>

<select id="horario">
<option disabled selected>Selecciona horario</option>
</select>

<button onclick="next()">Continuar</button>
</div>

<!-- PASO 2 -->
<div class="step">
<input id="nombre" placeholder="Nombre completo">
<input id="nacionalidad" placeholder="Nacionalidad">
<input id="fecha" placeholder="DD/MM/AAAA">
<input id="edad" type="number" placeholder="Edad">
<input id="telefono" placeholder="Teléfono">
<input id="correo" placeholder="Correo">
<input id="domicilio" placeholder="Domicilio">
<input id="estudios" placeholder="Último grado de estudios">

<button onclick="prev()">Atrás</button>
<button onclick="next()">Continuar</button>
</div>

<!-- PASO 3 -->
<div class="step">
<input id="tutor" placeholder="Nombre tutor">
<input id="tel_tutor" placeholder="Tel tutor">
<input id="parentesco" placeholder="Parentesco">
<input id="ocupacion" placeholder="Ocupación">

<button onclick="prev()">Atrás</button>
<button onclick="guardar()">Enviar inscripción</button>
</div>

</div>

<script>

// FORMATO FECHA
document.getElementById('fecha').addEventListener('input', e=>{
let v=e.target.value.replace(/\D/g,'').slice(0,8);
if(v.length>=5)
e.target.value=v.replace(/(\d{2})(\d{2})(\d{1,4})/,'$1/$2/$3');
else if(v.length>=3)
e.target.value=v.replace(/(\d{2})(\d{1,2})/,'$1/$2');
});

// HORARIOS BEAUTY
const horariosBeauty = [
"📍 Lakin - Lunes 8:00 am - 2:00 pm",
"📍 Lakin - Martes 8:00 am - 2:00 pm",
"📍 Lakin - Miércoles 8:00 am - 2:00 pm",
"📍 Lakin - Jueves 2:00 pm - 8:00 pm",
"📍 Lakin - Viernes 2:00 pm - 8:00 pm",
"📍 Lakin - Sábado 8:00 am - 2:00 pm",
"📍 Lakin - Sábado 2:00 pm - 8:00 pm"
];

// TODOS LOS HORARIOS
const opciones = {

"Bachillerato Garantizado":[
"📍 Tulum - Sáb 16 Mayo 4:00 pm - 9:00 pm",
"📍 Lakin - Sáb 16 Mayo 4:00 pm - 9:00 pm",
"💻 Online - Sáb 16 Mayo 4:00 pm - 9:00 pm",
"📍 Kabah - Dom 17 Mayo 8:00 am - 1:00 pm"
],

"Bachillerato Livier":[
"📍 Kabah - Lun 18 Mayo 7:30 am - 10:00 am",
"📍 Lakin - Lun 18 Mayo 3:00 pm - 5:30 pm"
],

"Primaria":[
"📍 Kabah - Mar/Mié 6:00 pm - 8:00 pm",
"📍 Lakin - Mar/Mié 6:00 pm - 8:00 pm",
"📍 Kabah - Dom 9:00 am - 1:00 pm",
],

"Secundaria":[
"📍 Kabah - Mar/Mié 6:00 pm - 8:00 pm",
"📍 Lakin - Mar/Mié 6:00 pm - 8:00 pm",
"📍 Kabah - Dom 9:00 am - 1:00 pm",
],

"Asistente Educativo":[
"📍 Kabah - Lun/Jue 5:30 pm - 8:30 pm",
"📍 Kabah - Sáb 7:00 am - 1:00 pm"
],

"Inglés Kids y Teens":[
"📍 Kabah - Sáb 1:00 pm - 4:00 pm",
"📍 Lakin - Sáb 1:00 pm - 4:00 pm"
],

"Lectoescritura Kids y Teens":[
"📍 Tulum - Sáb 12:00 pm - 4:00 pm"
],

"Computación 6 meses":[
"📍 Lakin - Sáb 8:00 am - 12:00 pm"
],

"Computación + Inglés":[
"📍 Lakin - Sáb 4:00 pm - 8:00 pm"
],

"Colorimetría": horariosBeauty,
"Tratamientos Capilares": horariosBeauty,
"Maquillaje Profesional": horariosBeauty,
"Cortes y Barbería": horariosBeauty,
"Uñas Artísticas": horariosBeauty,
"Lashista": horariosBeauty,
"Terapeuta Spa": horariosBeauty

};

// ACTUALIZAR HORARIOS
function actualizarHorarios(){
let c=document.getElementById("curso").value;
let h=document.getElementById("horario");

h.innerHTML='<option disabled selected>Selecciona horario</option>';

if(opciones[c]){
opciones[c].forEach(x=>{
let o=document.createElement("option");
o.value=x;
o.textContent=x;
h.appendChild(o);
});
}
}

// STEPS
let step=0;
const steps=document.querySelectorAll(".step");

function show(){
steps.forEach(s=>s.classList.remove("active"));
steps[step].classList.add("active");
}

function next(){ if(step<2) step++; show(); }
function prev(){ if(step>0) step--; show(); }

function guardar(){
alert("Formulario funcionando correctamente ✅");
}

</script>

</body>
</html>
